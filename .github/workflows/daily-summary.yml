name: Fallback daily LINE summary

on:
  schedule:
    # 備援：11:15 UTC = 19:15 Asia/Taipei。
    # 正式的 19:00 觸發請交給 cron-job.org；GitHub Actions 的 scheduled
    # workflow 不保證準點。若主要排程已完成，Redis 的每日鎖會讓此任務略過。
    - cron: '15 11 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call summary endpoint
        run: |
          curl -sf -X POST "https://honorai-line.onrender.com/tasks/summary" \
            -H "x-trigger-secret: ${{ secrets.SUMMARY_TRIGGER_SECRET }}"
